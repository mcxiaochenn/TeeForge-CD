name: Keybox Sync

concurrency:
  group: teeforge-page-publish
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build format validator
        run: cargo build --locked -p teeforge --bin teeforge

      - name: Fetch upstream keybox
        id: fetch
        run: |
          UPSTREAM_URL="https://github.com/MeowDump/Integrity-Box/releases/download/archive/Megatron"
          STATUS_URL="https://raw.githubusercontent.com/MeowDump/Integrity-Box/refs/heads/main/keybox/key-status"

          for SLOT in 1 2 3; do
            SUFFIX=""
            if [ "$SLOT" != "1" ]; then SUFFIX="$SLOT"; fi
            curl -fsSL "${UPSTREAM_URL}${SUFFIX}" -o "/tmp/megatron_raw_${SLOT}" --retry 3 --connect-timeout 15 --max-time 120 --max-filesize 2097152
            test -s "/tmp/megatron_raw_${SLOT}"
          done
          curl -fsSL "$STATUS_URL" -o /tmp/key-status --retry 3 --connect-timeout 15 --max-time 120 --max-filesize 2097152
          test -s /tmp/key-status

          CURRENT_HASH=$(sha256sum /tmp/megatron_raw_1 /tmp/megatron_raw_2 /tmp/megatron_raw_3 | sha256sum | awk '{print $1}')
          echo "hash=$CURRENT_HASH" >> $GITHUB_OUTPUT

          if [ -f keybox/upstream_hash ]; then
            OLD_HASH=$(cat keybox/upstream_hash)
          else
            OLD_HASH=""
          fi

          CURRENT_MONTH=$(date +%Y-%m)
          if [ -f keybox/month ]; then
            OLD_MONTH=$(cat keybox/month)
          else
            OLD_MONTH=""
          fi

          NEED_UPDATE=false
          TRIGGER="${{ github.event_name }}"

          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            echo "reason=manual_trigger" >> $GITHUB_OUTPUT
            NEED_UPDATE=true
          elif [ "$CURRENT_HASH" != "$OLD_HASH" ]; then
            echo "reason=hash_changed" >> $GITHUB_OUTPUT
            NEED_UPDATE=true
          elif [ "$CURRENT_MONTH" != "$OLD_MONTH" ]; then
            echo "reason=new_month" >> $GITHUB_OUTPUT
            NEED_UPDATE=true
          else
            echo "reason=no_change" >> $GITHUB_OUTPUT
          fi

          echo "need_update=$NEED_UPDATE" >> $GITHUB_OUTPUT

      - name: Build keybox files
        if: steps.fetch.outputs.need_update == 'true'
        run: |
          # 状态文件放独立目录，避免混入 CDN 的 files/keybox/
          # Status files go to a separate dir, keep them out of CDN files/keybox/
          mkdir -p /tmp/status
          cp /tmp/key-status /tmp/status/
          echo "${{ steps.fetch.outputs.hash }}" > /tmp/status/upstream_hash
          echo "$(date +%Y-%m)" > /tmp/status/month

          MONTH=$(date +%Y-%m)
          curl -fsSL "https://github.com/mcxiaochenn.keys" --retry 3 --connect-timeout 15 --max-time 120 -o /tmp/pubkeys.txt
          sed -n '1p' /tmp/pubkeys.txt > /tmp/pubkey.txt
          test -s /tmp/pubkey.txt
          python3 .github/scripts/keybox_sync.py --input /tmp --output /tmp/omg_push/keybox --public-key /tmp/pubkey.txt --month "$MONTH" --validator target/debug/teeforge

      - name: Push to page branch
        if: steps.fetch.outputs.need_update == 'true'
        run: |
          # 克隆 page 分支 Clone page branch
          git clone --branch page --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/page_push

          # 复制 keybox 文件到 files/keybox/ Copy keybox files to files/keybox/
          rm -rf /tmp/page_push/files/keybox
          mkdir -p /tmp/page_push/files/keybox
          cp /tmp/omg_push/keybox/* /tmp/page_push/files/keybox/

          # 推送到 page 分支 Push to page branch
          cd /tmp/page_push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files/keybox/
          if ! git diff --cached --quiet; then
            git commit -m "keybox: update $(date +%Y-%m-%d)"
          fi
          git push origin page

      - name: Sync status to master
        if: steps.fetch.outputs.need_update == 'true'
        run: |
          git checkout master
          mkdir -p keybox
          cp /tmp/status/key-status keybox/
          cp /tmp/status/upstream_hash keybox/
          cp /tmp/status/month keybox/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keybox/
          if ! git diff --cached --quiet; then
            git commit -m "keybox: sync status $(date +%Y-%m-%d) [auto]"
          fi
          git push origin master
